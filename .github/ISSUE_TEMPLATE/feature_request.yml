name: Feature request
description: Something the toolbox should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to do?
      description: Describe it as a player goal ("find the best build I can wear with what I own, plus one item") rather than a solution, if you can.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you do today instead, and what's missing.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
