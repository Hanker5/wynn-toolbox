# Daily: fetch WynnBuilder's current data and run the suites a game patch would
# break (the fast one, and the comparison with WynnBuilder's own JS, which also
# checks the built-in version list). A failed run is the signal that a patch
# changed something; GitHub emails the repository owner.
name: patch watch
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Qt needs these even offscreen (see ci.yml).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - run: uv run wt fetch --refresh
      - run: uv run pytest -q
      - run: uv run pytest -q -m differential
