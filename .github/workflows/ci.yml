# Fast tests on all three platforms the installer supports. The terminal backend
# differs per OS (pty on Linux/macOS, ConPTY on Windows), so this is where the
# Windows and macOS code paths actually get exercised.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Qt's widgets load libEGL/libGL even on the offscreen platform, and the
      # Ubuntu runner image doesn't ship them (tests/test_window.py needs them).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - run: uv run wt fetch
      - run: uv run pytest -q
