# Fast tests on all three platforms the installer supports. The terminal backend
# differs per OS (pty on Linux/macOS, ConPTY on Windows), so this is where the
# Windows and macOS code paths actually get exercised.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run wt fetch
      - run: uv run pytest -q
