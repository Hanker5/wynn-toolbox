<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wynn Toolbox</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="titlebar" hidden>
  <div class="tb-drag">
    <svg class="tb-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 14 5.5 8 15 2 5.5Z" fill="var(--accent)"/><path d="M2 5.5h12M8 1 5.5 5.5 8 15l2.5-9.5L8 1" fill="none" stroke="var(--accent-text)" stroke-width=".9"/></svg>
    <span class="tb-title">Wynn Toolbox</span>
    <span id="tb-sub" class="muted"></span>
  </div>
  <button id="tb-update" class="tb-update" hidden>Update available</button>
  <div class="tb-buttons">
    <button id="tb-min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5.5h8"/></svg></button>
    <button id="tb-max" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true"><path class="max" d="M1.5 1.5h7v7h-7z"/><path class="restore" d="M1.5 3.5h5v5h-5zM3.5 3.5v-2h5v5h-2"/></svg></button>
    <button id="tb-close" class="tb-close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
  </div>
</header>
<div class="rz" data-edge="n"></div><div class="rz" data-edge="s"></div>
<div class="rz" data-edge="e"></div><div class="rz" data-edge="w"></div>
<div class="rz" data-edge="ne"></div><div class="rz" data-edge="nw"></div>
<div class="rz" data-edge="se"></div><div class="rz" data-edge="sw"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Wynn Toolbox <span id="version" class="muted"></span></div>
    <button id="new-build" class="primary wide">New build from goals</button>
    <button id="toggle-terminal" class="wide">Show terminal</button>
    <button id="ai-settings" class="wide" title="Choose the AI assistant that starts in the terminal">AI assistant…</button>
    <button id="open-inventory" class="wide">Inventory</button>
    <button id="open-compare" class="wide">Compare builds</button>
    <button id="check-updates" class="wide">Check for updates</button>
    <details class="import">
      <summary>Import a WynnBuilder link</summary>
      <input id="import-link" placeholder="https://wynnbuilder.github.io/builder/#…">
      <input id="import-name" placeholder="Name (optional)">
      <button id="import-go" class="wide">Import</button>
      <div id="import-msg" class="msg"></div>
    </details>
    <div class="section-label">Builds</div>
    <ul id="build-list"></ul>
  </aside>

  <main id="main">
    <div id="empty" class="empty">
      <h2>No build open</h2>
      <p>Pick a build on the left, import a WynnBuilder link, or make a new one from your goals.</p>
    </div>
    <section id="editor" hidden></section>
    <section id="solver" hidden></section>
    <section id="inventory" hidden></section>
    <section id="compare" hidden></section>
  </main>

  <aside id="terminal-panel" hidden>
    <div id="term-resize" title="Drag to resize"></div>
    <div class="term-head">
      <span class="term-title">Terminal <span class="muted">· runs in the toolbox folder</span></span>
      <span id="term-clis" class="row"></span>
      <button id="term-restart" title="Close this shell and start a fresh one">Restart shell</button>
      <button id="term-close" aria-label="Hide terminal">✕</button>
    </div>
    <div id="term-note" class="hint"></div>
    <section id="term-tools" aria-label="Running tools" aria-live="polite" hidden></section>
    <div id="term"></div>
  </aside>
</div>
<dialog id="setup" aria-labelledby="setup-title"></dialog>
<dialog id="update" class="modal" aria-labelledby="update-title"></dialog>
<dialog id="ask" class="modal"></dialog>
<div id="toast"></div>
<div id="tooltip" hidden></div>
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/app.js"></script>
<script src="/static/terminal.js"></script>
<script src="/static/setup.js"></script>
<script src="/static/titlebar.js"></script>
<script src="/static/updates.js"></script>
</body>
</html>
