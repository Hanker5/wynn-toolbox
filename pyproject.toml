[project]
name = "wynn-toolbox"
version = "0.1.0"
description = "AI-assisted Wynncraft build toolkit: decode and encode WynnBuilder links, solve gear and ability trees, and verify every result."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.11"]

[project.scripts]
wt = "wynntools.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wynntools"]

[tool.pytest.ini_options]
markers = ["slow: runs a full gear-solver search (takes minutes)"]
addopts = "-m 'not slow'"
